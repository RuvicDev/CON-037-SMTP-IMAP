[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-smtp-imap-connector"
version = "1.0.0"
description = "Conector Ruvic de correo genérico: enviar por SMTP y leer/buscar en la bandeja por IMAP, para cualquier proveedor (incluye OAuth2 para Gmail y Microsoft 365/Outlook)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_smtp_imap_connector*"]
